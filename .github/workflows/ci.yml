name: GROOVEPRINT CI
on:
  push:
    branches: [ main, feature/zero-click-bpm-mvp ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run test:syntax
      - run: node --check src/auto-bpm.js
