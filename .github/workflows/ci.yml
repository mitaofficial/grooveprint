name: GROOVEPRINT CI
on:
  push:
    branches: [ main, feature/zero-click-bpm-mvp ]
  pull_request:
    branches: [ main ]
# Cancel obsolete PR runs, but do not cancel validations on the protected main branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure FFmpeg so the private beat-reference CLI e2e is never silently skipped
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - run: npm run validate
      - run: npm run benchmark:compare
      - name: V3 original synthetic development-only score (not full-song validation)
        run: npm run benchmark:v3:development
      - name: V3 full synthetic precision/coverage versus original (development data only)
        run: npm run benchmark:v3:full-synthetic
      - name: V4 experimental event-to-beat DP on matched synthetic PCM (not independent music validation)
        run: npm run benchmark:v4:development

  browser_matrix:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      GROOVEPRINT_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify local codec fixture encoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - run: npm run test:browser
      - name: Mobile viewport smoke (390 x 844, simulated touch)
        run: npm run test:browser
        env:
          GROOVEPRINT_MOBILE: 1

  # Browser-based one-click regression with 10 persisted-legacy + 10 fresh sessions.
  # Provider responses are fixture-controlled; all UI, decoder and DSP code is real.
  evidence_matrix:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      GROOVEPRINT_BROWSER: ${{ matrix.browser }}
      GROOVEPRINT_REPEATS: '10'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Ensure FFmpeg exists
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Real-browser click to tracklist to DSP, 20 iterations
        run: npm run test:one-click
      - name: Upload screenshots, sanitized network trace and state checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpm-one-click-${{ matrix.browser }}
          path: .private/evidence/one-click-${{ matrix.browser }}-fixture/
          if-no-files-found: warn
          retention-days: 14

  # Separate live-provider proof. External outages are documented.
  live_research_browser:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROOVEPRINT_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Ensure FFmpeg exists
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Live public Discogs and authorized audio in real Chromium
        run: npm run test:one-click:live
      - name: Upload live provider trace and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpm-one-click-live
          path: .private/evidence/one-click-chromium-live/
          if-no-files-found: warn
          retention-days: 14

  # Preserve the existing required-check name while broadening browser coverage.
  browser:
    needs: [browser_matrix, evidence_matrix]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser and viewport to pass
        run: test "$BROWSER_RESULT" = success && test "$EVIDENCE_RESULT" = success
        env:
          BROWSER_RESULT: ${{ needs.browser_matrix.result }}
          EVIDENCE_RESULT: ${{ needs.evidence_matrix.result }}

  provider_probe:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/acoustic-live-probe.mjs

  licensed_audio_pilot:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check FFmpeg availability
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Compare V1 V2 V3 and research-only V4 on the same CC BY 4.0 techno loops
        run: npm run benchmark:licensed-techno -- --v3 --v4
      - name: Prepare independent offline librosa research baseline (ISC licensed)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned research-only librosa (not a webapp dependency)
        run: python -m pip install --quiet librosa==0.11.0
      - name: Run librosa dynamic-programming beat tracker on same authorized loop audio
        run: python scripts/bpm-v4-librosa-baseline.py .private/benchmarks/waivops-pilot/audio
      - name: Explain benchmark scope
        run: echo 'WaivOps EDM-TECH publisher BPM labels only. Not independently verified; repeated four-bar loops, not full tracks. Audio is not published as an artifact.'
