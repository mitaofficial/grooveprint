name: GROOVEPRINT CI
on:
  push:
    branches: [ main, feature/zero-click-bpm-mvp ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run test:syntax
      - run: node --check src/auto-bpm.js
      - run: npm run benchmark:compare

  browser:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs

  provider_probe:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/acoustic-live-probe.mjs
