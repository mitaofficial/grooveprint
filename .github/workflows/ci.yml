name: GROOVEPRINT CI
on:
  push:
    branches: [ main, feature/zero-click-bpm-mvp ]
  pull_request:
    branches: [ main ]
# Cancel obsolete PR runs, but do not cancel validations on the protected main branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run validate
      - run: npm run benchmark:compare

  browser_matrix:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      GROOVEPRINT_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify local codec fixture encoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - run: npm run test:browser
      - name: Mobile viewport smoke (390 x 844, simulated touch)
        run: npm run test:browser
        env:
          GROOVEPRINT_MOBILE: 1

  # Preserve the existing required-check name while broadening browser coverage.
  browser:
    needs: browser_matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser and viewport to pass
        run: test "$BROWSER_RESULT" = success
        env:
          BROWSER_RESULT: ${{ needs.browser_matrix.result }}

  provider_probe:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/acoustic-live-probe.mjs

  licensed_audio_pilot:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check FFmpeg availability
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Compare V1 and experimental V2 using CC BY 4.0 real techno loops
        run: npm run benchmark:licensed-techno
      - name: Explain benchmark scope
        run: echo 'WaivOps EDM-TECH publisher BPM labels only. Not independently verified; repeated four-bar loops, not full tracks. Audio is not published as an artifact.'
