name: Read-only GetSongBPM registration diagnostics
on:
  push:
    branches:
      - diagnostics/getsongbpm-registration-20261106
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/getsongbpm-public-diagnostics.mjs
