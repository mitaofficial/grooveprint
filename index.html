/* v1.1 — data enrichment and font selection */
.syncbar{margin:0 0 16px;border:1px solid #607044;background:#1f251a;padding:12px 14px}

.syncprogress>span{display:block;height:100%;background:#c5d36a;transition:width .3s}
.import-track-choice{display:flex;align-items:flex-start;gap:12px;padding:14px;margin:13px 0 18px;background:#20241b;border:1px solid #586544;cursor:pointer}
.import-track-choice input{width:18px;flex:0 0 18px;margin:2px 0}
.import-track-choice strong{font-size:12px;display:block;letter-spacing:.04em;color:#e1ec9c}
.import-track-choice small{font-size:11px;line-height:1.6;display:block;color:#b6b6ab;margin-top:6px}
.track-fetch{margin:6px 0 13px}
.font-sample{margin-top:10px;padding:11px;background:#e7e7df;color:#151515;font-size:15px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* GROOVEPRINT 1.5 / VECTOR STUDIO */

.side .audio-preview-row{grid-template-columns:30px minmax(0,1fr)}
.side .audio-preview-row>.flex{grid-column:2;flex-wrap:wrap;justify-content:flex-start}

.vector-inner svg#labelEditorSvg g.selected-layer{filter:drop-shadow(0px 0px 0.25px #a4c35a)}
.vector-note{border-top:1px solid #30342c;font:10px var(--mono);color:#b3b5a7;padding:10px 14px;background:#11130f}
.object-rows{display:grid;gap:5px;margin:8px 0}.object-row{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:8px 10px;font:11px var(--mono);color:#c8c9bf}.object-row.selected{background:#303a20;color:#e5f1c5;border-color:#b5c880}
.object-controls{padding:12px;border:1px solid #44493a;background:#1c2019;margin:12px 0}.object-controls h4{margin:0 0 12px;font-size:13px}.object-controls .two{margin-top:8px}.object-controls input,.object-controls select{font-size:12px}
.audio-preview-list{margin-top:14px;border:1px solid #343934;background:#141713}.audio-preview-row{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;padding:9px 12px;border-bottom:1px solid #343934}.audio-preview-row:last-child{border-bottom:0}.audio-preview-row small{color:#818a7d;font:10px var(--mono)}

.audio-preview-row .play-btn:disabled{opacity:.28}
.audio-preview-title{font-size:11px;overflow-wrap:anywhere}.audio-preview-row .audio-source-select{max-width:220px;min-width:112px;font-size:10px;padding:7px}
.audio-dock{position:relative;left:auto;transform:none;bottom:auto;z-index:auto;width:100%;max-width:100%;margin:13px 0 22px;background:#1d2119;border:1px solid #78854c;box-shadow:0 10px 50px #000c;padding:12px 16px;display:none;gap:10px;align-items:center}.audio-dock.on{display:grid}.audio-dock audio{width:100%;height:34px}.audio-dock iframe{display:block;width:100%;min-height:240px;aspect-ratio:16/9;height:auto;border:0;max-width:100%}.audio-dock .gp-preview-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.audio-dock .gp-preview-actions a{color:#c5d36a;font-size:12px}.audio-dock .gp-preview-note{font-size:11px;color:#b5b9aa;line-height:1.55}.audio-dock input[type=range]{accent-color:#c5d36a;width:100%}

function commit(fn,{history=true,render=true}={}){if(history)historyPush();fn();storeLater();if(render)renderApp()}

function parseDelimited(text,delimiter){let rows=[],row=[],field='',quoted=false,issues=[],at=0;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else if(quoted){quoted=false}else if(field===''){quoted=true}else field+=c}else if(c===delimiter&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];field='';at=i}else{field+=c}}if(quoted)issues.push('Unclosed quoted field');row.push(field);if(row.some(x=>x.trim()!==''))rows.push(row);return{rows,issues}}

function mappedDiscogsTracks(data){

  if(!entry||typeof entry!=='object')return;
  if(entry.type_==='heading')return;
  const pos=String(entry.position||parent||'').trim();
  if(Array.isArray(entry.sub_tracks)&&entry.sub_tracks.length){
   let subIndex=0;
   for(const sub of entry.sub_tracks){subIndex++;append({...sub,position:sub.position||`${pos}${String.fromCharCode(96+Math.min(subIndex,26))}`},pos)}
   return;
  }
  if(entry.type_&&entry.type_!=='track')return;
  const title=String(entry.title||'').trim();
  if(title)out.push({position:pos||String(out.length+1),title,bpm:null,source:'discogs',duration:String(entry.duration||''),previewUrl:'',previewKind:''});
 };
 if(Array.isArray(data?.tracklist))for(const row of data.tracklist)append(row);

}

async function requestDiscogsTracks(releaseId,signal){

 let lastError;

  if(signal?.aborted)throw new DOMException('Aborted','AbortError');
  try{
   const response=await fetch(discogsConnect.connected?`/api/discogs/releases/${encodeURIComponent(releaseId)}`:`https://api.discogs.com/releases/${encodeURIComponent(releaseId)}`,{
     method:'GET',mode:'cors',credentials:discogsConnect.connected?'same-origin':'omit',headers:{Accept:'application/json'},signal,cache:'no-store'
   });
   if(response.ok){const data=await response.json();return{tracks:mappedDiscogsTracks(data),videos:allowedReleaseVideos(data.videos)}}
   const err=new Error(`Discogs HTTP ${response.status} · release ${releaseId}`);err.status=response.status;

   }
   if(![429,500,502,503,504].includes(response.status)||attempt===3)throw err;
   await abortablePause(Math.max(1200,err.waitMs||1500*attempt*attempt),signal);
  }catch(e){
   lastError=e;
   if(e.name==='AbortError')throw e;
   if([401,403,404].includes(e.status)||e.waitMs>30000||attempt===3)throw e;

function discogsItemKey(x){return `${discogsConnect.username||''}:${x.discogsInstanceId}:${x.releaseId}`}
function mergeDiscogsPage(rows){
  let added=0,updated=0,conflicts=0;
  const byInstance=new Map(state.releases.filter(r=>r.discogsInstanceId).map(r=>[`${r.discogsUsername||discogsConnect.username}:${r.discogsInstanceId}:${r.releaseId}`,r]));
  const modifiable=['artist','title','label','catalog','year','format'];
  for(const data of rows){
    if(!data.discogsInstanceId||!data.releaseId)continue;
    const key=discogsItemKey(data);
    const stamp=new Date().toISOString();
    const source=Object.fromEntries(modifiable.map(k=>[k,String(data[k]||'')]));
    const existing=byInstance.get(key);
    if(!existing){
      const item=normalizeRelease({...source,releaseId:data.releaseId,tracks:[],discogsInstanceId:data.discogsInstanceId,discogsFolderId:data.discogsFolderId,discogsFetchedAt:stamp,discogsSource:source,discogsLink:data.sourceUrl||'',discogsUsername:discogsConnect.username});

      const conflictSet=new Set(existing.discogsConflicts||[]);
      for(const field of modifiable){

async function synchronizeDiscogs(){

      do{
        const data=await gpRequest('/api/discogs/sync',{method:'POST',body:JSON.stringify({folderId,page}),signal:discogsConnect.controller.signal});
        const delta=mergeDiscogsPage(data.releases||[]);
        discogsConnect.progress.pages++;discogsConnect.progress.items+=(data.releases||[]).length;discogsConnect.progress.total=Math.max(discogsConnect.progress.total,Number(data.pagination?.items)||0);

        state.active=state.active||state.releases[0]?.id||null;

    }

function importMain(){return`<div class="section-head"><div><div class="eyebrow">01 / INGEST THE ARCHIVE</div><h2 class="h2">Import your collection.</h2><p>Carica il CSV della collezione, associa le colonne e conserva ogni release.</p></div><div class="tag good">GUEST MODE</div></div>${discogsPanel()}<div id="dropzone" class="drop" tabindex="0" role="button" aria-label="Select CSV or project JSON file"><div><div class="big-icon">⇧</div><strong>DROP YOUR COLLECTION HERE</strong><p>CSV Discogs, CSV generico, TSV o progetto GROOVEPRINT JSON. Nessun upload su server: elaborazione nel browser.</p><div class="flex" style="justify-content:center;flex-wrap:wrap">${btn('CHOOSE A FILE','choose-file','primary')}${btn('ADD MANUALLY','add-manual','quiet')}</div><div class="footnote" style="margin-top:12px">CSV / TSV / JSON · MAX 20 MB</div></div></div>${formatCSVPreview()}<div class="flow-cards"><div class="flow-card"><b>01 / IMPORT</b><h4>Flexible mapping</h4><p>Riconoscimento colonne e gestione CSV con valori tra virgolette.</p></div><div class="flow-card"><b>02 / ENRICH</b><h4>No invented metadata</h4><p>Tracklist e BPM restano vuoti quando mancano nel file originale.</p></div><div class="flow-card"><b>03 / EXPORT</b><h4>Physical accuracy</h4><p>Etichette a misura e PDF vettoriale scaricabile.</p></div></div><div class="divider"></div><div class="tool-row">${btn('LOAD FICTIONAL DEMO','demo','quiet')}${btn('IMPORT SAVED PROJECT','choose-json','quiet')}</div><p class="footnote">La demo contiene dati fittizi; i player non creano audio inesistente. Associa sorgenti autorizzate alle tracce.</p>`}
function filtered(){const q=norm(state.search);return state.releases.filter(r=>{if(state.formatFilter!=='All'&&formatOf(r)!==state.formatFilter)return false;if(state.statusFilter!=='All'&&statusOf(r)!==state.statusFilter)return false;if(state.folderFilter&&state.folderFilter!=='All'&&String(r.discogsFolderId)!==String(state.folderFilter))return false;if(!q)return true;return norm([r.artist,r.title,r.label,r.catalog,r.releaseId,r.year].join(' ')).includes(q)})}
function reviewMain(){const list=filtered();return`<div class="section-head"><div><div class="eyebrow">02 / CATALOG CONTROL</div><h2 class="h2">Collection manager.</h2><p>Seleziona le release da stampare. Fai clic su una riga per modificare titoli, tracklist e BPM.</p></div><div class="flex" style="flex-wrap:wrap">${btn('PREPARE PRINT BATCH','gp-preflight','small primary')}${btn('↻ RECUPERA TRACKLIST','sync-tracklists','small quiet',discogsSync.running?'disabled':'')}${btn('＋ NEW RELEASE','add-manual','primary')}</div></div>${syncNotice()}${discogsConnect.connected?`<div class="gp-discogs-summary"><span class="tag good">DISCOGS · ${esc(discogsConnect.username)}</span>${btn("↻ SYNC COLLECTION","gp-sync","small quiet",discogsConnect.running?"disabled":"")}<span class="footnote">Latest import ${discogsConnect.progress.items} items · ${discogsConnect.progress.conflicts} source conflicts</span></div>`:""}<div class="list-controls"><input aria-label="Search releases" id="searchInput" placeholder="Search artist / title / catalog…" value="${esc(state.search)}"/><select id="filterFormat" aria-label="Filter format">${['All','Vinyl','CD','Cassette','Other'].map(f=>`<option ${state.formatFilter===f?'selected':''}>${f}</option>`).join('')}</select><select id="filterStatus" aria-label="Filter status">${['All','Ready','Missing tracklist','Needs review','Unsupported format'].map(f=>`<option ${state.statusFilter===f?'selected':''}>${f}</option>`).join('')}</select>${state.releases.some(r=>r.discogsInstanceId)?`<select id="gpFolderFilter" aria-label="Filter Discogs collection folder"><option value="All">ALL DISCOGS FOLDERS</option>${[...new Map(state.releases.filter(r=>r.discogsInstanceId).map(r=>[r.discogsFolderId,r.discogsFolderId])).keys()].filter(x=>x!==null).map(x=>`<option value="${x}" ${String(state.folderFilter)===String(x)?"selected":""}>FOLDER ${x}</option>`).join("")}</select>`:""}</div><div class="tablebox"><div class="flex between" style="background:#20201f;padding:10px 12px;border-bottom:1px solid #343434"><span class="mono tiny">${list.length} / ${state.releases.length} RELEASES · ${state.selected.length} SELECTED</span><div class="flex">${btn('ALL','select-all','small quiet')}${btn('NONE','select-none','small quiet')}</div></div><div class="rel-list">${list.length?list.slice(0,1500).map(r=>`<div class="rel-item ${state.active===r.id?'active':''}" data-open-rel="${r.id}"><input type="checkbox" data-check-rel="${r.id}" aria-label="Print ${esc(r.artist)} ${esc(r.title)}" ${state.selected.includes(r.id)?'checked':''}/><div><h4>${esc(displayArtist(r.artist)||'Unknown Artist')} <span class="muted">/</span> ${esc(r.title||'Untitled')}</h4><div class="meta">${esc(r.label||'—')} · ${esc(r.catalog||'NO CAT')} · ${esc(r.year||'—')} · ${esc(formatOf(r))}</div>${gpDataAttribution(r)?`<div><a class="gp-source-link" href="${esc(gpDataAttribution(r))}" target="_blank" rel="noopener">Data provided by Discogs.</a></div>`:''}</div><div class="meta2"><div class="tag ${statusOf(r)==='Ready'?'good':statusOf(r)==='Needs review'?'bad':''}">${esc(statusOf(r))}</div><br/><small>${r.tracks.length} TRACKS${r.duplicate?' · DUPLICATE':''}</small></div></div>`).join(''):`<div class="empty">No releases match the current filters.</div>`}</div></div>${list.length>1500?`<div class="alert info" style="margin-top:8px">Visualizzo le prime 1500 righe per mantenere la lista reattiva. Utilizza la ricerca per filtrare.</div>`:''}<div class="preview-top"><span class="preview-legend">La selezione determina quali etichette compariranno nel PDF.</span>${btn('DESIGN LABELS →','go-design','primary')}</div><div id="gpPreviewMount" class="gp-preview-mount" aria-live="polite"></div><p class="footnote" style="margin:7px 0 18px">ANTEPRIMA · Seleziona una traccia nella scheda release a destra e premi ▶. Il player YouTube comparirà qui (solo sul sito web HTTPS, se il video consente l’incorporamento). In HTML offline resta disponibile il link diretto.</p>`}
function reviewSide(){const r=rel();if(!r)return`<div class="eyebrow">RELEASE EDITOR</div><p class="subtle">Seleziona una release dalla libreria.</p>`;const fields=[['artist','Artist'],['title','Release title'],['label','Label'],['catalog','Catalog no.'],['year','Year'],['format','Format'],['releaseId','Release ID']];return`<div class="eyebrow">RELEASE PROPERTIES</div>${discogsSourceNotice(r)}${r.discogsInstanceId?`<div class="flex" style="margin:8px 0">${btn('SALVA COPIA LOCALE','gp-detach','small quiet')}</div>`:''}<h3 style="margin-top:8px">${esc(displayArtist(r.artist)||'NEW RELEASE')}</h3><div class="flex between" style="margin-bottom:15px"><div class="tag">${esc(statusOf(r))}</div><div class="flex">${btn('⎘','duplicate-rel','iconbtn','title="Duplicate release"')}${btn('⌫','delete-rel','iconbtn warn','title="Delete release"')}</div></div><div class="stack">${fields.map(([k,l])=>`<label class="field"><span>${l}</span><input data-rel-field="${k}" value="${esc(k==='artist'?displayArtist(r[k]):r[k])}" placeholder="${l}"/></label>`).join('')}<label class="field"><span>Notes (private)</span><textarea data-rel-field="notes">${esc(r.notes)}</textarea></label></div><div class="side-head">TRACKLIST · ${r.tracks.length} TRACKS</div>${!r.tracks.length?`<div class="track-fetch">${r.releaseId?btn('↻ RECUPERA DA DISCOGS','sync-active','primary small',discogsSync.running?'disabled':''):'<p class="subtle">Per recuperare la tracklist serve il Release ID Discogs.</p>'}${r.tracklistError?`<p class="tiny" style="color:#f0ab83">${esc(r.tracklistError)}</p>`:''}</div>`:r.tracklistFetchedAt?'<div class="tiny muted" style="margin-bottom:10px">Tracklist: recuperata da Discogs · BPM da verificare</div>':''}<div class="edit-tracks">${r.tracks.map((t,i)=>`<div class="trackrow"><input data-track="${i}:position" aria-label="Track position" value="${esc(t.position)}" placeholder="A1"/><input data-track="${i}:title" aria-label="Track title" value="${esc(t.title)}" placeholder="Track title"/><input type="number" min="0" max="400" step="0.1" data-track="${i}:bpm" aria-label="BPM" value="${t.bpm===null?'':esc(t.bpm)}" placeholder="BPM"/><button class="iconbtn small warn" data-rm-track="${i}" title="Remove track">×</button></div>`).join('')}</div><div class="flex" style="margin-top:10px">${btn('＋ ADD TRACK','add-track','quiet small')}${btn('PASTE TRACKS','paste-tracks','small quiet')}${btn('TAP BPM','goto-tap','small')}</div><div class="divider"></div><div class="side-head">AUDIO PREVIEW / OGNI TRACCIA</div>${r.tracks.length?`${btn('↻ VIDEO DISCOGS','fetch-preview-videos','small quiet')}${trackPreviewList(r)}`:'<p class="subtle">Recupera o aggiungi la tracklist per associare le anteprime.</p>'}<div class="divider"></div><div class="alert info">Il nome originale importato resta modificabile, mentre i suffissi Discogs (2), (4)… sono nascosti da libreria e PDF. Le tracklist vengono richieste tramite ID, senza inventare BPM.</div>`}
function designTrackPanel(r){if(!r)return'';return`<div style="margin-top:22px"><div class="flex between"><div><div class="eyebrow">TRACKLIST & BPM / ${esc(r.catalog||'RELEASE')}</div><h3 style="margin:8px 0">Fondamentali sempre visibili</h3></div><div class="flex" style="gap:8px"><span class="tag ${state.design.showTracks?'good':''}">TRACKLIST ${state.design.showTracks?'ON':'OFF'}</span><span class="tag ${state.design.showBpm?'good':''}">BPM ${state.design.showBpm?'ON':'OFF'}</span></div></div>${!r.tracks.length?`<div class="alert error">Questa release non ha ancora una tracklist. Il CSV Discogs spesso contiene soltanto il Release ID: recupera i brani oppure inseriscili manualmente.</div>${r.releaseId?`<div style="margin-top:8px">${btn('↻ RECUPERA TRACKLIST DISCOGS','sync-active','small primary',discogsSync.running?'disabled':'')}</div>`:''}`:`<div class="edit-tracks">${r.tracks.map((t,i)=>`<div class="trackrow"><input data-track="${i}:position" aria-label="Track position" value="${esc(t.position)}" placeholder="A1"/><input data-track="${i}:title" aria-label="Track title" value="${esc(t.title)}" placeholder="Track title"/><input type="number" min="0" max="400" step="0.1" data-track="${i}:bpm" aria-label="BPM" value="${t.bpm===null?'':esc(t.bpm)}" placeholder="BPM"/><button class="iconbtn small warn" data-rm-track="${i}" title="Remove track">×</button></div>`).join('')}</div>`}<div class="flex" style="margin-top:10px">${btn('＋ ADD TRACK','add-track','quiet small')}${btn('PASTE TRACKS','paste-tracks','small quiet')}${btn('TAP BPM','goto-tap','small')}</div>${!state.design.showTracks||!state.design.showBpm?`<p class="footnote" style="margin-top:8px">Attenzione: nel template attuale ${!state.design.showTracks?'la tracklist è nascosta':''}${!state.design.showTracks&&!state.design.showBpm?' e ':''}${!state.design.showBpm?'i BPM sono nascosti':''}. Riattiva i toggle nel pannello design.</p>`:''}</div>`}

function designMain(){const sel=printable(),r=rel()||sel[0],errors=validateSheet(),over=sel.filter(x=>composeLabel(x,{...state.design,isExport:true}).warnings.length);return`<div class="section-head"><div><div class="eyebrow">03 / VECTOR DESIGN STUDIO</div><h2 class="h2">Create at any scale.</h2><p>Anteprima paginata delle etichette selezionate, zoom vettoriale, posizionamento in mm e tracklist/BPM per ogni brano. Un PDF con tutte le pagine viene generato dalla scheda PRINT.</p></div><div class="flex">${btn('↶ UNDO','undo','small quiet',undoStack.length?'':'disabled')}${btn('↷ REDO','redo','small quiet',redoStack.length?'':'disabled')}${btn('RESTORE ORIGINAL DJ LAYOUT','restore-dj','small primary')}${btn('SAVE TEMPLATE','save-template','small quiet')}</div></div><div class="tool-row" style="margin-bottom:8px"><label class="field" style="flex:1;max-width:330px"><span>RELEASE DA MODIFICARE</span><select id="editorReleaseSelect">${sel.map(x=>`<option value="${esc(x.id)}" ${x.id===r?.id?'selected':''}>${esc(displayArtist(x.artist)+' / '+(x.catalog||x.title))}</option>`).join('')}</select></label><div class="tag good">LIVE VECTOR — NO RASTER</div><div class="tag">${esc(state.design.rotation)}° CONTENT</div></div>${(()=>{const n=sel.length,per=state.sheet.cols*state.sheet.rows,pages=Math.max(1,Math.ceil(n/per)),page=clamp(state.printPage,0,pages-1);return `<div class="preview-top" style="margin:12px 0 8px"><span class="preview-legend">ANTEPRIMA A4 · ${n} ETICHETTE / ${pages} FOGLI (${per} PER FOGLIO)</span><div class="pager">${btn('←','page-prev','small quiet',page===0?'disabled':'')}<span>FOGLIO ${page+1} / ${pages}</span>${btn('→','page-next','small quiet',page>=pages-1?'disabled':'')}</div></div>`})()}${designCanvas()}<div class="page-note"><div class="card"><div class="eyebrow">PRINT GEOMETRY</div><strong>${fmtN(state.sheet.labelW)} × ${fmtN(state.sheet.labelH)} mm</strong><p>Contenuto ruotato, reticolo fisico invariato.</p></div><div class="card"><div class="eyebrow">DYNAMIC FIELDS</div><strong>${sel.length} etichette / ${Math.max(1,Math.ceil(sel.length/(state.sheet.cols*state.sheet.rows)))} fogli</strong><p>Il PDF include automaticamente tutti i fogli, non solo quello in anteprima.</p></div><div class="card"><div class="eyebrow">LAYOUT CHECK</div><strong>${over.length} etichette da rivedere</strong><p>${over.length?'Controlla elementi fuori area e dimensioni della tracklist.':'Nessun overflow già rilevato.'}</p></div></div>${errors.length?`<div class="alert error">${esc(errors.join('; '))}</div>`:''}${over.length?`<div class="alert error"><b>${over.length} etichetta/e da verificare prima della stampa.</b><div style="margin-top:7px">${over.slice(0,5).map(rec=>`<div style="padding:3px 0"><b>${esc(displayArtist(rec.artist))} / ${esc(rec.catalog||rec.title)}</b> — ${esc(composeLabel(rec,{...state.design,isExport:true}).warnings.join(' · '))}</div>`).join('')}${over.length>5?`<div>... e altre ${over.length-5} release</div>`:''}</div></div>`:''}<div class="print-actions">${btn('↓ PDF VETTORIALE','pdf','primary')}${btn('SVG SINGOLA ETICHETTA','svg','quiet')}${btn('CONFIGURAZIONE STAMPA','go-print','quiet')}</div>${designTrackPanel(r)}${r&&r.tracks.length?`<div style="margin-top:22px"><div class="flex between"><div><div class="eyebrow">TRACK PREVIEW / ${esc(r.catalog||'RELEASE')}</div><h3 style="margin:8px 0">Ascolta ogni traccia</h3></div>${btn('↻ VIDEO DISCOGS','fetch-preview-videos','small quiet')}</div>${trackPreviewList(r)}</div>`:''}`}

function designSide(){const d=state.design,sty=resolveStyle(d);return`<div class="eyebrow">VECTOR LAYERS</div><div class="object-rows">${layerList().map(([g,l])=>`<button class="object-row ${state.editor?.selected===g?'selected':''}" data-layer-select="${esc(g)}"><span>▣ ${esc(l)}</span><span>↕</span></button>`).join('')}</div><div class="tool-row" style="margin:10px 0;gap:5px">${btn('+ TEXT','new-text','small primary')}${btn('+ LINE','new-line','small quiet')}${btn('+ BOX','new-rect','small quiet')}</div>${propertyPanel()}<div class="divider"></div><div class="eyebrow">MASTER TEMPLATE</div><h3 style="margin:11px 0 16px">Visual controls</h3><div class="setting"><label>STYLE PRESET</label><select data-design="preset">${Object.entries(STYLE).map(([v,s])=>`<option value="${v}" ${d.preset===v?'selected':''}>${s.name}</option>`).join('')}</select></div><div class="setting"><label>FONT FAMILY / STYLE</label><select data-design="font">${Object.entries(FONT_OPTIONS).map(([k,f])=>`<option value="${k}" ${d.font===k?'selected':''}>${f.label}</option>`).join('')}</select><div class="font-sample" style="font-family:${fontCSS(d.font)};font-style:${(FONT_OPTIONS[d.font]||FONT_OPTIONS.sans).italic?'italic':'normal'};font-weight:${(FONT_OPTIONS[d.font]||FONT_OPTIONS.sans).weight}">ABCDEF · 123456 · TECHNO</div></div><div class="setting"><label>CONTENT ROTATION <span class="measure">${d.rotation}°</span></label><div class="segment">${[0,90,180,270].map(n=>`<button data-rot="${n}" class="${d.rotation===n?'sel':''}">${n}°</button>`).join('')}</div><p class="tiny muted">Rotate only the art inside each label. The sheet grid stays fixed.</p></div><div class="setting"><label>FONT SIZE <span class="measure">${d.fontPt} PT</span></label><input type="range" min="6" max="20" step=".5" data-design="fontPt" value="${d.fontPt}"/></div><div class="setting"><label>INNER MARGIN <span class="measure">${d.margin} MM</span></label><input type="range" min="2" max="12" step=".5" data-design="margin" valu eadings: SIDE A / SIDE B</span><input type="checkbox" data-design-check="sideHeadings" ${d.sideHeadings!==false?'checked':''}/></label><label class="choice"><span>Separators between sides</span><input type="checkbox" data-design-check="sideDividers" ${d.sideDividers!==false?'checked':''}/></label><div style="margin-top:10px">${btn('↺ RESTORE ORIGINAL DJ LAYOUT','restore-dj','small primary')}</div><p class="footnote">Ripristina il layout protetto mantenendo release, BPM e sorgenti audio. Il ripristino è annullabile.</p><div class="side-head">MY TEMPLATES</div><div class="stack"><select id="savedTemplates"><option value="">— Scegli un template salvato —</option>${(state.savedTemplates||[]).map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select><div class="flex" style="flex-wrap:wrap">${btn('SAVE CURRENT','save-template','small primary')}${btn('APPLY','apply-template','small quiet')}${btn('DELETE','delete-template','small quiet')}</div></div><div class="side-head">COLORS</div><div class="color-grid"><div class="swatch"><input type="color" data-design="customBg" value="${d.customBg||sty.bg}"/><label>Background<small class="muted">Label fill</small></label></div><div class="swatch"><input type="color" data-design="customFg" value="${d.customFg||sty.fg}"/><label>Text<small class="muted">Main type</small></label></div><div class="swatch"><input type="color" data-design="customMuted" value="${d.customMuted||sty.muted}"/><label>Muted<small class="muted">Meta text</small></label></div><div class="swatch"><input type="color" data-design="customLine" value="${d.customLine||sty.line}"/><label>Lines<small class="muted">Rules / dividers</small></label></div></div><p class="watermark-note">Suggerimento: scegli sfondi più scuri solo se la stampante regge bene il pieno.</p><div class="divider"></div>${[['artistBold','Bold artist'],['cleanArtist','Nascondi suffissi Discogs (2), (4)…'],['showLabel','Record label metadata'],['showYear','Year'],['showTracks','Tracklist'],['showBpm','BPM per track'],['showFoot','Archive footer'],['showWatermark','QR code + Made with GROOVEPRINT (FREE)']].map(([k,l])=>`<label class="choice"><span>${l}</span><input type="checkbox" data-design-check="${k}" ${(k==='showWatermark'||d[k])?'checked':''} ${k==='showWatermark'?'disabled':''}/></label>`).join('')}<div class="side-head">FREE vs PRO · CONCEPT</div><div class="plan-grid"><div class="plan-card ${state.plan==='free'?'active':''}"><div class="plan-kicker">FREE</div><h4>Built-in branding</h4><p class="subtle" style="margin:0">QR leggibile in basso a sinistra e firma “Made with GROOVEPRINT”.</p><ul><li>Import / review / design / print</li><li>12 font styles</li><li>Vector PDF export</li><li>Watermark always visible</li></ul><div class="divider"></div>${btn('USE FREE PREVIEW','plan-free','small quiet',state.plan==='free'?'disabled':'')}</div><div class="plan-card ${state.plan==='pro'?'active':''}"><div class="plan-kicker">PRO</div><h4>Cleaner professional output</h4><p class="subtle" style="margin:0">Anteprima senza watermark. L'export resta Free finché l'abbonamento non è verificato.</p><ul><li>Brand-free preview (export requires a verified Pro entitlement)</li><li>More polished final labels</li><li>Better for brand/client use</li><li>Future premium features ready</li></ul><div class="divider"></div>${btn('PREVIEW PRO MODE','plan-pro','small primary',state.plan==='pro'?'disabled':'')}</div></div><div class="alert info" style="margin-top:12px">L'anteprima Pro illustra il layout senza branding, ma non sblocca alcun acquisto. PDF, SVG e stampa browser rimangono Free finché non viene implementata una verifica dei diritti Pro.</div><div class="divider"></div>${btn('RESET DESIGN','reset-design','quiet small')}${btn('SAVE PROJECT JSON','json','small')}</div>`}
function printMain(){const sh=state.sheet,issues=validateSheet(),selected=printable();return`<div class="section-head"><div><div class="eyebrow">04 / THE PRESSROOM</div><h2 class="h2">Print with precision.</h2><p>Genera il PDF direttamente dal modello fisico del foglio. Scala stampa: 100%.</p></div><div class="tag good">VECTOR OUTPUT</div></div>${gpPreflightPanel()}<div class="info-grid"><div class="card"><b>${selected.length}</b><p>SELECTED LABELS</p></div><div class="card"><b>${selected.length?Math.ceil(selected.length/(sh.cols*sh.rows)):0}</b><p>PDF PAGES</p></div><div class="card"><b>${fmtN(sh.labelW)}<span style="font-size:12px"> mm</span></b><p>LABEL WIDTH</p></div><div class="card"><b>${fmtN(sh.labelH)}<span style="font-size:12px"> mm</span></b><p>LABEL HEIGHT</p></div></div><div class="preview-top"><span class="preview-legend">A4 / SHEET OVERVIEW</span><div class="pager">${btn('←','page-prev','small quiet',state.printPage===0?'disabled':'')}<span>${state.printPage+1} / ${Math.max(1,Math.ceil(selected.length/(sh.cols*sh.rows)))}</span>${btn('→','page-next','small quiet',state.printPage>=Math.ceil(selected.length/(sh.cols*sh.rows))-1?'disabled':'')}</div></div><div class="paper-stage"><div class="page-wrap">${svgSheet()}</div></div>${issues.length?`<div class="alert error" style="margin-top:14px">${esc(issues.join(' · '))}</div>`:''}${unsupportedPDFCharacters()?`<div class="alert error">Caratteri non latini rilevati: il PDF diretto usa font PDF standard. Per mantenere tutti i caratteri usa OPEN PRINT DIALOG → Salva come PDF, poi verifica il risultato.</div>`:''}<div class="print-actions">${btn('↓ DOWNLOAD PRINT PDF','pdf','primary')}${btn('OPEN PRINT DIALOG','print-browser','quiet')}${btn('↓ CALIBRATION PDF','calibration','quiet')}</div><div class="alert">Impostazioni stampante: <b>dimensione effettiva / 100%</b>, <b>adatta alla pagina disattivato</b>, margini zero quando supportati. Le etichette che arrivano al bordo richiedono una stampante borderless per copertura completa.</div><p class="footnote" style="margin-top:12px">Il PDF contiene testi e tracciati vettoriali con font PDF standard Helvetica/Courier (non incorporati in questa versione). Non è stata ancora eseguita una prova fisica su tutte le stampanti. Confronta sempre il foglio di calibrazione con un righello prima di applicare gli adesivi.</p>`}
function printSide(){const s=state.sheet,c=state.calibration;const field=(key,label,step='0.25')=>`<label class="field"><span>${label}</span><input type="number" step="${step}" data-sheet="${key}" value="${s[key]}"/></label>`;return`<div class="eyebrow">SHEET GEOMETRY</div><h3 style="margin:11px 0 17px">Physical print template</h3><div class="setting"><label>LAYOUT PRESET</label><select id="sheetPreset"><option value="ref" ${s.cols===2&&s.rows===4&&s.labelW===105&&s.labelH===74.25?'selected':''}>A4 · 8 · 105 × 74.25 MM</option><option value="letter">US Letter · 8 generic equal labels</option>${[2,4,6,10,12].map(n=>`<option value="${n}">A4 · ${n} equal labels (generic)</option>`).join('')}<option value="custom">Custom physical dimensions</option></select></div><div class="side-head">PAGE SIZE / MM</div><div class="two">${field('pageW','Width')}${field('pageH','Height')}</div><div class="side-head">STICKER SIZE / MM</div><div class="two">${field('labelW','Width')}${field('labelH','Height')}</div><div class="side-head">ROWS & COLUMNS</div><div class="two">${field('cols','Columns','1')}${field('rows','Rows','1')}</div><div class="side-head">OFFSETS & GAPS / MM</div><div class="two">${field('left','Left')}${field('top','Top')}${field('gapX','H. gap')}${field('gapY','V. gap')}</div><div class="divider"></div><div class="side-head">PRINT OPTIONS</div><label class="choice"><span>Stampa linee guida tratteggiate (OFF di default)</span><input type="checkbox" id="printGuides" ${state.printGuides?'checked':''}/></label><p class="footnote">Senza linee guida il foglio stampato non presenta separatori visibili. Il PDF di calibrazione mostra sempre i contorni.</p><div class="side-head">PRINTER CALIBRATION</div><label class="field"><span>Printer profile</span><input data-calib="printer" value="${esc(c.printer)}"/></label><div class="two" style="margin-top:9px"><label class="field"><span>X correction / mm</span><input type="number" step=".25" data-calib="x" value="${c.x}"/></label><label class="field"><span>Y correction / mm</span><input type="number" step=".25" data-calib="y" value="${c.y}"/></label></div><p class="footnote" style="margin:10px 0">Gli offset spostano il contenuto stampato; non modificano le dimensioni della griglia fisica.</p>${btn('↓ TEST SHEET PDF','calibration','primary')}<div class="divider"></div><div class="alert info">Le impostazioni sono salvate localmente insieme al progetto. Non compensare una stampante non borderless riducendo il foglio.</div>`}
function faqMain(){return`<div class="eyebrow">GROOVEPRINT / USER GUIDE</div><h2 class="h2">A tool, not a mockup.</h2><p class="subtle">Versione locale, senza account. I progetti restano nel browser; richieste a Discogs solo quando attivi il recupero metadati.</p><div class="faq"><details open><summary>Come importo una collezione Discogs?</summary><p>Esporta il CSV, importalo e verifica soprattutto il mapping Release ID. Se selezioni RECUPERA LE TRACKLIST DA DISCOGS, l'app richiede la tracklist di ogni release senza tracce all'API pubblica. In REVIEW puoi ripetere il recupero per le release mancanti. I BPM non vengono inventati.</p></details><details><summary>Come ottengo le 8 etichette A4 verticali?</summary><p>Usa il preset A4 · 8 · 105 × 74,25 mm, con contenuto a 90°. Ogni regione fisica rimane larga 105 mm e alta 74,25 mm, qualunque sia la rotazione del testo.</p></details><details><summary>Come stampo correttamente?</summary><p>Scarica il PDF, stampa il foglio di calibrazione e misura la riga da 100 mm. Poi stampa al 100% (dimensione effettiva), senza adattamento pagina. Le linee tratteggiate nel PDF finale sono disabilitate per impostazione predefinita e possono essere attivate in PRINT. Verifica il supporto borderless della stampante.</p></details><details><summary>I dati sono privati?</summary><p>Il CSV e i progetti rimangono nel browser (IndexedDB), ma scegliendo Recupera tracklist l'app contatta Discogs per ciascun Release ID. Non invia il CSV completo. Esporta un JSON di backup: svuotare i dati del browser può cancellare il progetto.</p></details><details><summary>Come ascolto le anteprime per singola traccia?</summary><p>In REVIEW o DESIGN scegli ↻ VIDEO DISCOGS per leggere i video YouTube associati alla release. La disponibilità dipende dalla release e dall’autorizzazione all’incorporamento. Puoi associare un video a una traccia, inserire un URL audio lecito oppure selezionare un file audio locale. Non scarichiamo musica e non inventiamo tracce o anteprime. I file locali vanno ricollegati dopo la chiusura della sessione.</p></details><details><summary>Posso usare la funzione audio BPM Pro?</summary><p>Non ancora. L'analisi audio automatica richiede un algoritmo validato o un servizio dedicato; non è simulata. Sono disponibili inserimento manuale e Tap BPM.</p></details><details><summary>Il font è incorporato nel PDF?</summary><p>Le 12 combinazioni tipografiche sfruttano i font PDF standard Helvetica, Times e Courier (anche Bold e Oblique), vettoriali ma non incorporati. Per tipografie con regole particolari verifica la corrispondenza e fai una stampa di prova.</p></details></div><div class="divider"></div>${btn('BACK TO WORKSPACE','go-review','primary')}`}
function tapBPM(){const now=performance.now();if(tapTimes.length&&now-tapTimes[tapTimes.length-1]>2400)tapTimes=[];tapTimes.push(now);tapTimes=tapTimes.slice(-16);if(tapTimes.length<3)return null;const intervals=[];for(let i=1;i<tapTimes.length;i++)intervals.push(tapTimes[i]-tapTimes[i-1]);const ordered=[...intervals].sort((a,b)=>a-b),median=ordered[Math.floor(ordered.length/2)],good=intervals.filter(ms=>Math.abs(ms-median)/median<.25);if(!good.length)return null;const avg=good.reduce((a,b)=>a+b,0)/good.length;return clamp(60000/avg,20,300)}

let center=step===0?importMain():step===1?reviewMain():step===2?designMain():printMain();let side=step===0?`<div class="eyebrow">THE WORKFLOW</div><h3 style="margin-top:9px">Your records, perfectly labeled.</h3><p class="subtle">I tuoi dati rimangono sul dispositivo. Importa i record e gestisci la tracklist prima di creare le etichette.</p><div class="divider"></div><div class="stack"><div class="tag good">CSV PARSER · LOCAL</div><div class="tag">FREE PROJECT STORAGE</div><div class="tag">VECTOR PDF EXPORT</div><div class="tag">FREE / PRO READY</div></div><div class="divider"></div><div class="alert info">Free: QR + watermark obbligatori. Pro: export pulito senza marchio.</div><div class="divider"></div>${btn('LOAD FICTIONAL DEMO','demo','primary')}`:step===1?reviewSide()+`<div class="divider"></div>${state.showTap?tapWidget():btn('OPEN TAP BPM TOOL','goto-tap','quiet')}`:step===2?designSide():printSide();

t:85vh;overflow:auto"><div class="flex between"><b>GROOVEPRINT / GUIDE</b>${btn('CLOSE ✕','help','quiet small')}</div>${faqMain()}</div></div>`:''}`;

function onAct(act,button){if(act.startsWith('step-')){setStep(Number(act.slice(-1)));return}switch(act){case'gp-detach':gpDetachLocalRelease();break;case'gp-preflight':state.step=3;renderApp();break;case'gp-connect':void startDiscogsAuth();break;case'gp-sync':void synchronizeDiscogs();break;case'gp-folders':void fetchDiscogsFolders();break;case'gp-stop':discogsConnect.controller?.abort();break;case'gp-disconnect':void disconnectDiscogs();break;case'choose-file':case'choose-json':$('fileChooser').click();break;case'apply-csv':applyCSV();break;case'sync-tracklists':void syncDiscogsTracklists(false);break;case'sync-active':void syncDiscogsTracklists(true);break;case'stop-sync':stopDiscogsSync();break;case'cancel-csv':pendingCSV=null;renderApp();break;case'demo':if(state.releases.length&&!confirm('Replace current collection with fictional demo data?'))return;loadDemo();break;case'add-manual':addManual();break;case'go-review':setStep(1);break;case'go-design':state.editor=state.editor||{mode:'label',zoom:100,snap:true,selected:'artist'};setStep(2);break;case'mode-label':state.editor.mode='label';renderApp();break;case'mode-sheet':state.editor.mode='sheet';renderApp();break;case'zoom-out':applyZoom(state.editor.zoom-1);break;case'zoom-in':applyZoom(state.editor.zoom+1);break;case'zoom-actual':applyZoom(100);break;case'zoom-fit':fitCanvasZoom();break;case'zoom-center':centerCanvas();break;case'new-text':createElement('text');break;case'new-line':createElement('line');break;case'new-rect':createElement('rect');break;case'object-delete':deleteObject();break;case'object-duplicate':duplicateObject();break;case'object-reset':{const g=state.editor.selected;if(g.startsWith('custom:')){modifyObject('x',8);modifyObject('y',12)}else commit(()=>{state.design.objects=state.design.objects||{};state.design.objects[g]={...(state.design.objects[g]||{}),dx:0,dy:0}});break}case'fetch-preview-videos':void fetchPreviewVideos();break;case'go-print':setStep(3);break;case'select-all':commit(()=> lab.decks[1].assign='B';
lab.candidates=(safeStorage().candidates||[]).slice(0,100);
function fileFor(index,file){if(!file)return;if(file.size>180*1024*1024){toast('File oltre 180 MB: scegli un file più leggero',true);return;}const d=lab.decks[index];stopDeck(d);d.file=file;d.buffer=null;d.analysis=null;d.bpm=null;file.arrayBuffer().then(async data=>{const ctx=await context();d.buffer=await ctx.decodeAudioData(data);d.position=0;d.rate=1;d.bpm=null;lab.view='mix';renderApp();toast('Audio locale caricato. Clicca ANALYZE BPM.');}).catch(e=>toast('Audio non decodificabile: '+e.message,true));}
async function analyze(index){const d=lab.decks[index];if(!d.buffer)return toast('Carica un audio prima di analizzarlo',true);try{const a=estimateTempo(d.buffer);d.analysis=a;d.bpm=a.bpm;renderApp();toast(`BPM ${a.bpm} (${a.ambiguous?'AMBIGUO':'STIMATO'}) — verifica a orecchio prima di usarlo per SYNC`);}catch(e){toast(e.message,true)}}

async function analyzeReleaseTrackBpm(releaseId,index){
 if(gpBpmBusy!==null)return toast('È già in corso un’analisi BPM.',true);
 const record=state.releases.find(r=>r.id===releaseId),track=record?.tracks[index],entry=localAudioFiles.get(releaseId+':'+index);
 if(!track||!entry?.file)return toast('Carica prima un file audio della traccia con FILE.',true);
 gpBpmBusy=releaseId+':'+index;renderApp();
 try{
  const context=new (window.AudioContext||window.webkitAudioContext)();
  let buffer;
  try{buffer=await context.decodeAudioData(await entry.file.arrayBuffer());}
  finally{await context.close().catch(()=>{});}
  if(buffer.duration<8)throw Error('Servono almeno 8 secondi di audio.');
  const result=estimateTempo(buffer);
  if(!Number.isFinite(result.bpm))throw Error('Nessun BPM valido riconosciuto.');
  const current=state.releases.find(r=>r.id===releaseId)?.tracks[index];
  if(current!==track)throw Error('La tracklist è cambiata durante l’analisi: riprova.');
  commit(()=>{
   track.bpm=result.bpm;
   track.bpmStatus='estimated';
   track.bpmCandidates=result.candidates.slice(0,8);
   track.bpmAgreement=result.segmentAgreement;
   track.bpmAnalysisAt=result.analysisAt;
   track.source='audio-estimate';
  });
  const candidates=result.candidates.slice(0,4).map(c=>c.bpm).join(', ');
  toast('Stima '+result.bpm+' BPM ('+(result.ambiguous?'ambigua':'da verificare')+'). Alternative: '+candidates);
 }catch(err){toast('Analisi BPM: '+err.message,true)}
 finally{gpBpmBusy=null;renderApp()}
}
function confirmReleaseBpm(releaseId,index){
 const r=state.releases.find(r=>r.id===releaseId),track=r?.tracks[index];
 if(!track||!Number.isFinite(Number(track.bpm)))return toast('Analizza prima il BPM.',true);
 const options=(track.bpmCandidates||[]).slice(0,5).map(x=>x.bpm).join(', ');
 const raw=prompt('Conferma o correggi il BPM dopo aver ascoltato la traccia.\nStima: '+track.bpm+' BPM\nAlternative: '+(options||'nessuna')+'\nAttenzione a metà/doppio tempo.',String(track.bpm));
 if(raw===null)return;
 const value=Number(raw.replace(',','.'));
 if(!Number.isFinite(value)||value<40||value>300)return toast('BPM non valido (40–300).',true);
 commit(()=>{track.bpm=Number(value.toFixed(2));track.bpmStatus='verified';track.source='user-verified';});
 toast('BPM confermato: '+value+' — apparirà senza ~ nell’etichetta.');
}

async function searchExternal(){
 if(!discogsConnect?.connected){lab.externalError='Collega prima il tuo account Discogs dalla schermata IMPORT.';renderApp();return;}
 const q=lab.query.trim(),genre=lab.genre.trim();if(!q&&!genre){lab.externalError='Inserisci artista/titolo oppure genere/stile';renderApp();return;}
 try{const params=new URLSearchParams();if(q)params.set('q',q);if(genre)params.set('style',genre);
 const result=await gpRequest('/api/discogs/discover?'+params.toString());lab.external=result.releases||[];lab.externalAt=Date.parse(result.fetchedAt)||Date.now();lab.externalError='';renderApp();}
 catch(e){lab.external=[];lab.externalError='Ricerca catalogo non disponibile: '+e.message;renderApp();}
}
function displayReleases(){const releases=state.releases.filter(r=>!r.discogsInstanceId||gpIsFresh(r.discogsFetchedAt));const seed=releases.find(r=>r.id===lab.sourceId)||releases.find(r=>r.id===state.active)||releases[0];return {seed,recs:recommend(seed,releases,lab.mode,lab.query,lab.genre)};}
function makeDiscover(){const {seed,recs}=displayReleases();return `<div class="gp-lab-heading"><div class="eyebrow">05 / COLLECTION INTELLIGENCE</div><h2 class="h2">Discover records.</h2><p>Raccomandazioni spiegabili dalla tua collezione. Per dischi nuovi serve una ricerca catalografica reale; non mostriamo release inventate.</p></div>
<div class="gp-lab-card"><label>PARTI DA UN DISCO <select id="gp-seed"><option value="">Seleziona dalla collezione</option>${state.releases.filter(r=>!r.discogsInstanceId||gpIsFresh(r.discogsFetchedAt)).map(r=>`<option value="${escLab(r.id)}" ${seed?.id===r.id?'selected':''}>${escLab(displayArtist(r.artist))} — ${escLab(r.title)}</option>`).join('')}</select></label><div class="gp-lab-grid"><label>RICERCA <input id="gp-discover-search" value="${escLab(lab.query)}" placeholder="Artist, label, release..."/></label><label>GENERE / STILE <input id="gp-discover-genre" value="${escLab(lab.genre)}" placeholder="Filtro su metadata/notes, se presenti"/></label></div><div class="gp-lab-pills">${[['similar','SIMILI'],['artist','STESSO ARTISTA'],['label','STESSA LABEL'],['genre','STILE / GENERE']].map(([mode,title])=>`<button data-lab="mode" data-value="${mode}" class="${lab.mode===mode?'gp-lab-active':''}">${title}</button>`).join('')}</div></div>
<div class="gp-lab-card"><div class="gp-lab-topline"><strong>DISCOVER NEW VINYL / DISCOGS CATALOG</strong></div><p class="gp-lab-meta">Ricerca di release non presenti nella tua collezione; richiede Discogs Connect live, con rispetto dei limiti API.</p><button data-lab="external-search">SEARCH REAL RELEASES</button>${lab.externalError?`<p class="gp-lab-reason">${escLab(lab.externalError)}</p>`:''}${(Date.now()-lab.externalAt<15*60*1000?lab.external:[]).map(r=>`<div class="gp-lab-result"><div><strong>${escLab(r.title)}</strong><div class="gp-lab-meta">${escLab(r.label)} · ${escLab(r.catalog)} · ${escLab(r.year)} · ${escLab([...(r.genre||[]),...(r.style||[])].join(', '))}</div></div><div class="gp-lab-controls"><a target="_blank" rel="noopener" href="${escLab(r.sourceUrl)}">VIEW ON DISCOGS ↗</a><button data-lab="external-candidate" data-id="${escLab(r.releaseId)}">CONSIDER FOR MIX</button></div></div>`).join('')}<div class="gp-lab-meta">Data provided by Discogs · <a href="https://www.discogs.com" target="_blank" rel="noopener">Discogs</a>. No images, pricing or permanent caching.</div></div>
<div class="gp-lab-count">${recs.length} risultati dalla collezione caricata — le somiglianze testuali sono euristiche</div>${recs.slice(0,80).map(r=>`<div class="gp-lab-result"><div><strong>${escLab(displayArtist(r.artist))}</strong> — ${escLab(r.title)}<div class="gp-lab-meta">${escLab(r.label||'Label sconosciuta')} · ${escLab(r.catalog||'')} · ${escLab(r.year||'')}</div><div class="gp-lab-reason">${r._why.length?r._why.map(escLab).join(' · '):'Nessun segnale di somiglianza identificato'}</div></div><div class="gp-lab-controls"><button data-lab="open-record" data-id="${escLab(r.id)}">SCHEDA</button><button data-lab="send-deck" data-deck="1" data-id="${escLab(r.id)}">DECK B</button>${gpSourceUrl(r.releaseId)?`<a target="_blank" rel="noopener" href="${escLab(gpSourceUrl(r.releaseId))}">DISCOGS ↗</a>`:''}</div></div>`).join('')||'<div class="gp-lab-card">Nessun risultato. Importa più release o prova un altro filtro.</div>'}<div class="gp-lab-card gp-lab-note">Non sono possibili raccomandazioni di nuove release senza un catalogo esterno verificato. Questa prima versione consiglia dischi già presenti nei dati caricati e segnala i limiti delle informazioni disponibili.</div>`;}
function deckCard(d,i){const records=state.releases.filter(r=>!r.discogsInstanceId||gpIsFresh(r.discogsFetchedAt));const matching=records.find(r=>r.id===d.releaseId);return `<div class="gp-deck"><div class="gp-deck-head"><span>DECK ${i?'B':'A'}</span><span>${d.file?'LOCAL AUDIO / DSP AVAILABLE':'NO LOCAL AUDIO'}</span></div><div class="gp-deck-title">${escLab(d.file?.name||'Load a permitted local audio file')}</div><label>RECORD FROM COLLECTION<select data-gp-record="${i}"><option value="">No record selected</option>${records.map(r=>`<option value="${escLab(r.id)}" ${r.id===d.releaseId?'selected':''}>${escLab(displayArtist(r.artist))} — ${escLab(r.title)}</option>`).join('')}</select></label>${matching?.tracks?.length?`<label>TRACK POSITION <select data-gp-track="${i}">${matching.tracks.map((t,k)=>`<option value="${k}" ${d.trackIndex===k?'selected':''}>${escLab(t.position)} ${escLab(t.title)}</option>`).join('')}</select></label><button data-lab="save-bpm" data-deck="${i}">SAVE CONFIRMED BPM TO SELECTED TRACK</button>`:''}${d.releaseId?`<div class="gp-lab-meta">Selected record: ${escLab(displayArtist(state.releases.find(r=>r.id===d.releaseId)?.artist||''))} — ${escLab(state.releases.find(r=>r.id===d.releaseId)?.title||'')} · Link is not an audio match</div>`:''}<label class="gp-upload">LOAD WAV / MP3 / FLAC<input data-gp-file="${i}" type="file" accept="audio/*,.wav,.mp3,.flac,.aiff,.aif" /></label><div class="gp-bpm-value">${d.bpm==null?'--.--':d.bpm.toFixed(2)} <small>BPM · ${d.analysis?'ESTIMATED':'UNVERIFIED'}</small></div><div class="gp-lab-mini">${d.buffer?durationFmt(d.buffer.duration)+' · '+d.buffer.sampleRate+' Hz':'Audio file required for analysis and sync'}</div><div class="gp-lab-deckactions"><button data-lab="analyze" data-deck="${i}">ANALYZE BPM</button><button data-lab="play" data-deck="${i}">${d.playing?'PAUSE':'PLAY'}</button><button data-lab="cue" data-deck="${i}">CUE</button><button data-lab="sync" data-deck="${i}">BEAT SYNC*</button></div><label>CONFIRM / EDIT BPM <input data-gp-bpm="${i}" type="number" min="40" max="250" step="0.01" value="${d.bpm??''}" placeholder="BPM" /></label><label>POSITION <input data-gp-seek="${i}" type="range" min="0" max="${d.buffer?.duration||1}" value="${d.position}" step="0.05" ${d.buffer?'':'disabled'}/><span data-gp-time="${i}">${durationFmt(d.position)}</span></label><label>VOLUME <input data-gp-volume="${i}" type="range" min="0" max="1" step="0.01" value="${d.volume}"/></label><label>CROSSFADER ASSIGNMENT <select data-gp-assign="${i}">${['A','B','THRU'].map(x=>`<option ${d.assign===x?'selected':''}>${x}</option>`).join('')}</select></label><div class="gp-lab-grid">${['LOW','MID','HIGH'].map((name,k)=>`<label>${name} <input data-gp-eq="${i}:${k}" type="range" min="-15" max="9" step="1" value="${d.eq[k]}"/></label>`).join('')}</div><div class="gp-lab-mini">${d.analysis?`${d.analysis.ambiguous?'⚠ BPM AMBIGUO · ':''}Candidates: ${d.analysis.candidates.slice(0,3).map(v=>`${v.bpm}`).join(' / ')} BPM · Segmenti ${d.analysis.segmentAgreement==null?'n/d':Math.round(d.analysis.segmentAgreement*100)+'%'} · Grid offset ${d.analysis.anchor.toFixed(3)}s`:'Tempo / beatgrid not yet analyzed'}</div></div>`;}
function makeMix(){return `<div class="gp-lab-heading"><div class="eyebrow">06 / AUDIO WORKSTATION</div><h2 class="h2">Vinyl Mix Lab.</h2><p>Due deck AudioContext reali, EQ e crossfader A/B/THRU. SYNC su beatgrid stimata, da verificare a orecchio. PlaybackRate cambia anche la tonalità: il time-stretching indipendente non è ancora disponibile.</p></div><div class="gp-lab-decks">${lab.decks.map(deckCard).join('')}</div><div class="gp-lab-card"><div class="gp-lab-topline"><strong>MASTER MIXER</strong><span>Crossfader: <span id="gp-cross-value">${lab.cross}</span>%</span></div><input data-gp-cross type="range" min="0" max="100" value="${lab.cross}"/><button data-lab="save-candidate">SAVE MIX CANDIDATE</button><span class="gp-lab-mini">*Beat-phase alignment depends on detected beatgrid, not verified downbeats. Only accessible, locally loaded audio can be synchronized.</span></div><h3>MY MIX CANDIDATES</h3>${lab.candidates.slice(-12).reverse().map((c,i)=>`<div class="gp-lab-result"><div>${escLab(c.a)} + ${escLab(c.b)}<div class="gp-lab-meta">Saved ${escLab(c.date)} · BPM ${escLab(c.abpm||'unknown')} / ${escLab(c.bbpm||'unknown')}</div></div></div>`).join('')||'<p class="subtle">Nessuna combinazione salvata.</p>'}`;}
function updateCounters(){for(const [i,d] of lab.decks.entries()){const el=document.querySelector(`[data-gp-time="${i}"]`),seek=document.querySelector(`[data-gp-seek="${i}"]`);if(el)el.textContent=durationFmt(d.buffer?currentPos(d):0);if(seek&&d.buffer&&document.activeElement!==seek)seek.value=currentPos(d).toFixed(2);}}
function attachView(){if(!restoreReady)return;const nav=document.querySelector('.topnav'),main=document.querySelector('#mainCenter'),side=document.querySelector('#rightSide'),rail=document.querySelector('.rail');if(!nav||!main||!side)return;nav.insertAdjacentHTML('afterbegin',`<button data-lab="navigate" data-value="discover" class="${lab.view==='discover'?'active':''}">DISCOVER</button><button data-lab="navigate" data-value="mix" class="${lab.view==='mix'?'active':''}">MIX LAB</button>`);
 if(lab.view){main.innerHTML=lab.view==='discover'?makeDiscover():makeMix();side.innerHTML=`<div class="eyebrow">AUDIO & DISCOVERY</div><h3 style="margin-top:8px">LOCAL-FIRST</h3><p class="subtle">Analisi audio sul dispositivo, dati Discogs soggetti al Compliance Guard. Funzionalità streaming DSP non disponibili.</p><div class="divider"></div><p class="subtle">BPM = stima. Beat sync = allineamento provvisorio basato sui beat stimati. Usa i tuoi file autorizzati per mixare.</p>`;
 rail.insertAdjacentHTML('beforeend','<div class="gp-lab-rail"><button data-lab="navigate" data-value="discover">◉ DISCOVER</button><button data-lab="navigate" data-value="mix">◉ MIX LAB</button></div>');}}
const formerRender=renderApp;renderApp=function(){formerRender();attachView();};
// The original app loads from IndexedDB asynchronously; update navigation after initial load.
const oldClick=onAct;onAct=function(a,b){if(a.startsWith('step-')||['go-review','go-design','go-print'].includes(a))lab.view='';return oldClick(a,b);};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-lab]');if(!b)return;e.preventDefault();const a=b.dataset.lab,i=Number(b.dataset.deck||0),d=lab.decks[i];try{
 if(a==='navigate'){lab.view=b.dataset.value;renderApp();}
 if(a==='mode'){lab.mode=b.dataset.value;renderApp();}
 if(a==='open-record'){state.active=b.dataset.id;lab.view='';state.step=1;renderApp();}
 if(a==='send-deck'){const r=state.releases.find(x=>x.id===b.dataset.id);if(r){const deck=lab.decks[1];stopDeck(deck);deck.buffer=null;deck.file=null;deck.analysis=null;deck.bpm=null;deck.position=0;deck.releaseId=r.id;deck.trackIndex=0;lab.view='mix';renderApp();toast(`Release ${r.artist} — ${r.title} selezionata. Carica file locale autorizzato per sincronizzare.`)}}
 if(a==='external-search')await searchExternal();
 if(a==='external-candidate'){const r=lab.external.find(x=>x.releaseId===b.dataset.id);if(r){toast('Apri la release su Discogs per confrontarla. Il salvataggio permanente dei dati catalografici non è attivato per questa anteprima.');window.open(r.sourceUrl,'_blank','noopener');}}
 if(a==='save-bpm'){const r=state.releases.find(x=>x.id===d.releaseId),t=r?.tracks[d.trackIndex];if(!t||!d.buffer||!(d.bpm>0))throw Error('Seleziona una release con tracce, carica un audio e analizza/conferma il BPM');if(!confirm('Confermi che il file locale riproduce esattamente la traccia selezionata e che hai verificato il valore '+d.bpm+' BPM?'))return;commit(()=>{t.bpm=d.bpm;t.source='manual';});toast('BPM confermato e salvato nella tracklist: '+t.position);}
 if(a==='analyze')await analyze(i);
 if(a==='play'){await context();if(d.playing)stopDeck(d);else playDeck(i);renderApp();}
 if(a==='cue'){stopDeck(d);d.position=0;renderApp();}
 if(a==='sync'){await context();syncDeck(i);renderApp();}
 if(a==='save-candidate'){lab.candidates.push({a:lab.decks[0].file?.name||'No file A',b:lab.decks[1].file?.name||'No file B',abpm:lab.decks[0].bpm,bbpm:lab.decks[1].bpm,date:new Date().toISOString().slice(0,16)});lab.candidates=lab.candidates.slice(-100);saveCandidates();renderApp();}
 }catch(err){toast(err.message,true);}},true);
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='gp-seed'){lab.sourceId=t.value;renderApp();}
 if(t.id==='gp-discover-search'){lab.query=t.value;renderApp();}
 if(t.id==='gp-discover-genre'){lab.genre=t.value;renderApp();}
 if(t.dataset.gpFile!==undefined){fileFor(Number(t.dataset.gpFile),t.files?.[0]);}
 if(t.dataset.gpBpm!==undefined){const d=lab.decks[Number(t.dataset.gpBpm)],num=Number(t.value);if(num>=40&&num<=250){d.bpm=num;if(d.analysis){d.analysis={...d.analysis,bpm:num,beats:Array.from({length:Math.ceil(d.buffer?.duration*num/60)||0},(_,k)=>d.analysis.anchor+k*60/num).filter(t=>t<(d.buffer?.duration||0)),verified:false,label:'MANUAL CORRECTION'};}renderApp();}else toast('Inserisci BPM tra 40 e 250',true);}
 if(t.dataset.gpRecord!==undefined){const i=Number(t.dataset.gpRecord),d=lab.decks[i];stopDeck(d);d.file=null;d.buffer=null;d.analysis=null;d.bpm=null;d.rate=1;d.position=0;d.releaseId=t.value;d.trackIndex=0;renderApp();}
 if(t.dataset.gpTrack!==undefined){lab.decks[Number(t.dataset.gpTrack)].trackIndex=Number(t.value);renderApp();}
 if(t.dataset.gpAssign!==undefined){lab.decks[Number(t.dataset.gpAssign)].assign=t.value;updateMix();}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.gpCross!==undefined){lab.cross=Number(t.value);updateMix();const s=document.querySelector('#gp-cross-value');if(s)s.textContent=lab.cross;}
 if(t.dataset.gpVolume!==undefined){lab.decks[Number(t.dataset.gpVolume)].volume=Number(t.value);updateMix();}
 if(t.dataset.gpEq!==undefined){const [i,k]=t.dataset.gpEq.split(':').map(Number),d=lab.decks[i];d.eq[k]=Number(t.value);if(d.filters)d.filters[k].gain.setTargetAtTime(d.eq[k],lab.ctx.currentTime,.015);}
 if(t.dataset.gpSeek!==undefined){const d=lab.decks[Number(t.dataset.gpSeek)];if(d.buffer){const resume=d.playing;stopDeck(d);d.position=clamp(Number(t.value),0,d.buffer.duration-.01);if(resume)playDeck(Number(t.dataset.gpSeek));updateCounters();}}
});
// Refresh counters without rebuilding controls or triggering external requests.
setInterval(()=>{if(lab.view==='mix')updateCounters();},200);
window.GrooveprintLabTest={recommend,estimateTempo,lab};
})();
